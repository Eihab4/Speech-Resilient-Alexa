[project]
name = "speech-resilient-alexa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.104",
    "boto3-stubs~=1.43.104",
    "fastmcp>=4.0.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["mcp-server", "tests"]
testpaths = ["tests"]
