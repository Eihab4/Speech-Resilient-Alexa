[project]
name = "speech-resilient-alexa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "amazon-transcribe>=0.6.4",
    "boto3>=1.43.104",
    "boto3-stubs~=1.43.104",
    "fastmcp>=4.0.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "websockets>=17.1",
]

[tool.pytest.ini_options]
pythonpath = ["mcp-server", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["mcp-server", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["brain", "config", "enums", "memory", "messages", "tools", "transcription", "utils", "support"]
