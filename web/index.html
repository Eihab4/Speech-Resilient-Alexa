<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speech-Resilient Alexa</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">Speech-Resilient Alexa</p>
      <h1>Say it your way.</h1>
      <p class="intro">Send a fragment. Alexa keeps the context, instead of making you start over.</p>

      <form id="turn-form">
        <label>
          User ID
          <input id="user-id" value="demo-user" required />
        </label>
        <label>
          What did you say?
          <input id="heard" placeholder="Tomorrow… doctor… ten" required autocomplete="off" />
        </label>
        <div class="actions">
          <button type="submit" id="send">Send</button>
          <button type="button" id="mic" class="secondary" aria-pressed="false" hidden>Speak</button>
          <button type="button" id="mute" class="secondary" aria-pressed="false">Mute Alexa</button>
        </div>
        <p id="voice-hint" class="hint" aria-live="polite"></p>
      </form>

      <p id="sos-countdown" class="sos-countdown" role="alert" hidden></p>

      <section id="conversation" aria-live="polite" aria-label="Conversation">
        <p class="empty">Try a short or incomplete phrase.</p>
      </section>

      <details id="people" class="people">
        <summary>People who help me</summary>
        <p class="hint">For the family: who gets an alert when Alexa hears "I fell" or "help help".</p>

        <form id="profile-form">
          <label>
            Name in the alert
            <input id="profile-name" required autocomplete="off" placeholder="Ahmed" />
          </label>
          <label>
            Home address
            <input id="profile-address" autocomplete="off" placeholder="Sent when the device gives no location" />
          </label>
          <button type="submit">Save</button>
        </form>

        <form id="helper-form">
          <label>
            Add a helper
            <input id="helper-name" required autocomplete="off" placeholder="Sara" />
          </label>
          <button type="submit">Add</button>
        </form>

        <ul id="helpers" aria-label="Helpers"></ul>

        <div class="actions">
          <button type="button" id="allow-location" class="secondary">Allow location for emergencies</button>
        </div>
        <p id="people-status" class="hint" aria-live="polite"></p>
      </details>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
